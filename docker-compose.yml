version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - NEXT_PUBLIC_DEMO_MODE=true
      - DEMO_AUTH_ENABLED=true
    volumes:
      - ./prisma:/app/prisma
      - ./public/uploads:/app/public/uploads

