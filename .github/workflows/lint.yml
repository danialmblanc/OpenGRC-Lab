name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v7
      with:
        node-version: 20
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Generate Prisma Client
      run: npx prisma generate
    
    - name: Run Lint
      run: npm run lint
